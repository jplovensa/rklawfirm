name: Deploy RK website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rk-site"
          cp index.html notary.html styles.css app.js i18n.js .nojekyll "$RUNNER_TEMP/rk-site/"
          cp -R assets "$RUNNER_TEMP/rk-site/assets"
          test -s "$RUNNER_TEMP/rk-site/index.html"
          test -s "$RUNNER_TEMP/rk-site/notary.html"
          test -s "$RUNNER_TEMP/rk-site/assets/rk-hero.mp4"

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/rk-site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
